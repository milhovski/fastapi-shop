services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/shop.db
      CORS_ORIGINS: '["https://shop.milhovski.com"]'
      DEBUG: "false"
    command: >-
      sh -c "python seed_data.py &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://shop.milhovski.com
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Add CLOUDFLARE_TUNNEL_TOKEN to the root .env file}
    depends_on:
      nginx:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  backend-data:
